async function loadExpiry() {
  const [d, dep] = await Promise.all([
    api('/console/expiry?within_days=' + STATE.expiry.within),
    api('/console/forecasts/depletion?lookback_days=30'),
  ]);
  const burn = {};
  dep.ingredients.forEach(i => { burn[i.ingredient_id] = i.avg_daily_consumption; });
  STATE.expiry.data = d.batches.map(b => {
    const rate = burn[b.ingredient_id];
    const usesUpIn = rate ? b.qty_base / rate : null;
    return { ...b, uses_up_in_days: usesUpIn, at_risk: !b.expired && (usesUpIn == null || usesUpIn > b.days_to_expiry) };
  });
  renderExpiry();
}
const EXPIRY_BUCKETS = [
  { key: 'expired', label: 'Expired or today', color: 'var(--bad-fill)', test: b => b.expired || b.days_to_expiry <= 0 },
  { key: 'soon', label: 'Within 7 days', color: 'var(--bad-fill)', test: b => !b.expired && b.days_to_expiry > 0 && b.days_to_expiry <= 7 },
  { key: 'month', label: '8–30 days', color: 'var(--warn-fill)', test: b => !b.expired && b.days_to_expiry > 7 && b.days_to_expiry <= 30 },
  { key: 'later', label: '31–90 days', color: 'var(--info-fill)', test: b => !b.expired && b.days_to_expiry > 30 },
];
function renderExpiry() {
  const st = STATE.expiry, list = st.data;
  const windows = [7, 30, 90, 180];
  const buckets = EXPIRY_BUCKETS.map(bk => ({ ...bk, items: list.filter(bk.test) }));
  const atRisk = list.filter(b => b.at_risk).length;
  setWork(`
    <div class="grid g4">${buckets.map(bk =>
      `<div class="kpi"><div class="l">${ic('exp')}${esc(bk.label)}</div>
        <div class="v" style="color:${bk.items.length ? bk.color : 'inherit'}">${bk.items.length}</div>
        <div class="f">batch${bk.items.length === 1 ? '' : 'es'}</div></div>`).join('')}</div>
    <div class="card">
      <div class="card-h"><div><h2>Expiry timeline</h2><p>Oldest stock first, so it gets used before it turns${atRisk ? ` · ${atRisk} batch${atRisk === 1 ? '' : 'es'} may not be used up in time` : ''}</p></div>
      <div class="r">
        <div class="tabs">${windows.map(w => `<button class="tab ${st.within === w ? 'on' : ''}" data-act="exp-window" data-w="${w}">${w}d</button>`).join('')}</div>
        <button class="btn btn-s btn-sm" data-act="export-expiry">${ic('dl')}Download</button>
        <button class="btn btn-s btn-sm" data-act="print-section">${ic('prn')}Print</button>
      </div></div>
      <div class="card-b" style="display:flex;flex-direction:column;gap:var(--s3)">
        ${list.length ? buckets.filter(bk => bk.items.length).map(bk => `
          <div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:11px">
              <span class="chip ${bk.key === 'expired' || bk.key === 'soon' ? 'bad' : bk.key === 'month' ? 'warn' : 'info'}">${esc(bk.label)}</span>
              <span class="sub">${bk.items.length} batch${bk.items.length === 1 ? '' : 'es'}</span>
            </div>
            <div class="grid g3">${bk.items.map(b => expiryCard(b, st.within, bk.color)).join('')}</div>
          </div>`).join('')
        : emptyState('Nothing expiring in this window', 'Widen the window above, or check back later.', 'exp')}
      </div>
    </div>`);
}
function expiryCard(b, withinDays, color) {
  const pct = Math.max(4, Math.min(100, 100 - (b.days_to_expiry / withinDays) * 100));
  // Shelf-life items never had a manufacturer date to begin with — labelling
  // them "Estimated" and swapping "exp <date>" for "storage life to <date>"
  // is what stops this from reading as a false certainty it never had.
  const estimated = b.tracking === 'estimated_shelf_life';
  return `<div class="batch" style="border-left-color:${color}">
    <div class="batch-h"><b>${esc(b.ingredient_name)}</b>${estimated ? `<span class="chip fore no-dot" title="Tracked by estimated shelf life — this ingredient has no manufacturer expiry date">Estimated</span>` : ''}<span class="lot">${esc(b.lot_no || '—')}</span>
      <span class="d" style="color:${color}" title="${estimated ? 'Days remaining (estimated storage life)' : 'Days to expiry'}">${b.expired ? (estimated ? 'past storage life' : 'expired') : b.days_to_expiry + ' d'}</span></div>
    <div class="shelf"><i data-w="${pct}%" style="background:${color}"></i></div>
    <div class="batch-m">
      <span>${num(b.qty_base, 2)} ${esc(b.base_unit)}</span>
      <span>${estimated ? 'est. storage life to ' + esc(b.expires_at) : 'exp ' + esc(b.expires_at)}</span>
      <span>${b.uses_up_in_days != null ? 'uses up in ' + num(b.uses_up_in_days, 0) + ' d' : 'not selling lately'}</span>
      ${b.at_risk ? `<span class="chip warn no-dot" style="margin-left:auto">May go to waste</span>`
        : (b.expired ? '' : `<span class="chip ok no-dot" style="margin-left:auto">On track</span>`)}
    </div></div>`;
}

async function loadVerification() {
  STATE.verification.data = await api('/console/queues/verification');

}
const VERIFY_FIELD_LABELS = {
  'ingredient.pack_size': 'Pack size',
  'ingredient.yield_factor': 'Usable amount',
  'ingredient.unit_cost': 'Cost',
  'recipe_line.qty_base': 'Recipe amount',
  'fefo_batch.expires_at': 'Expiry date',
  'unli_coefficient.lambda': 'Unlimited wings rate',
};
function verifyFieldLabel(f) { return VERIFY_FIELD_LABELS[f] || f; }
function verifyAction(i) {
  if (i.field.startsWith('ingredient.')) {
    const field = i.field.split('.')[1];
    return `<button class="btn btn-s btn-sm" data-act="verify" data-id="${i.row_id}" data-field="${field}" data-name="${esc(i.entity_name)}" data-current="${esc(i.current_value || '')}">${ic('chk')}Confirm</button>`;
  }
  if (i.field === 'recipe_line.qty_base') return `<span class="sub">Fix this in Recipes</span>`;
  if (i.field === 'fefo_batch.expires_at') return `<span class="sub">Set on next delivery</span>`;
  if (i.field === 'unli_coefficient.lambda') return `<span class="sub">Not editable here yet</span>`;
  return `<span class="sub">—</span>`;
}
const VERIFY_GROUP_CAP = 100;
const VERIFY_SOURCE_LABELS = {
  ingredient: 'Ingredient', recipe_line: 'Recipe line',
  fefo_batch: 'Stock batch', unli_coefficient: 'Unlimited wings rate',
};
function renderVerification() {
  const d = STATE.verification.data, st = STATE.verification;
  const fields = Object.keys(d.by_field).sort();
  let list = d.items;
  if (st.field) list = list.filter(i => i.field === st.field);

  // One card per real-world thing (an ingredient, a recipe line, a batch, an
  // unli rate) instead of one row per placeholder field — three unrelated
  // rows for the same ingredient's pack size, cost and usable amount was the
  // "messy" part; grouping puts everything about one thing in one place, and
  // makes clear which groups are fixable here versus fixed elsewhere.
  const groups = {};
  list.forEach(i => {
    const source = i.field.split('.')[0];
    const key = source + ':' + i.entity_id;
    if (!groups[key]) groups[key] = { source, entity_name: i.entity_name, items: [] };
    groups[key].items.push(i);
  });
  const groupList = Object.values(groups).sort((a, b) => a.entity_name.localeCompare(b.entity_name));
  const shown = groupList.slice(0, VERIFY_GROUP_CAP);
  const fixable = d.items.filter(i => i.field.startsWith('ingredient.')).length;

  setWork(`
    <div class="grid g3">
      ${kpi('Still unconfirmed', d.count, 'placeholders left from setup', 'db')}
      ${kpi('Fixable right here', fixable, 'pack size, usable amount, cost', 'chk')}
      ${kpi('Field types', fields.length, 'see tabs below', 'filt')}
    </div>
    <div class="card">
      <div class="card-h">
        <div><h2>Numbers that need a real value</h2><p>${groupList.length} thing${groupList.length === 1 ? '' : 's'} with a placeholder from setup — grouped so everything about one thing is in one place</p></div>
        <div class="r"><button class="btn btn-s btn-sm" data-act="export-verification">${ic('dl')}Download</button></div>
      </div>
      <div class="card-b tight"><div class="tabs">
        <button class="tab ${!st.field ? 'on' : ''}" data-act="verify-field" data-f="">All (${d.count})</button>
        ${fields.map(f => `<button class="tab ${st.field === f ? 'on' : ''}" data-act="verify-field" data-f="${f}">${esc(verifyFieldLabel(f))} (${d.by_field[f]})</button>`).join('')}
      </div></div>
      <div class="card-b" style="display:flex;flex-direction:column;gap:10px">
        ${shown.length ? shown.map(g => `
          <div class="verify-group">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
              <b style="font-size:13px">${esc(g.entity_name)}</b>
              <span class="chip mute no-dot">${esc(VERIFY_SOURCE_LABELS[g.source] || g.source)}</span>
              <span class="sub">${g.items.length} to confirm</span>
            </div>
            <table><tbody>${g.items.map(i => `<tr>
              <td style="white-space:nowrap"><span class="chip warn no-dot">${esc(verifyFieldLabel(i.field))}</span></td>
              <td class="n sub" style="white-space:nowrap">${esc(i.current_value === null || i.current_value === undefined ? '—' : i.current_value)}</td>
              <td class="sub">${esc(i.context || '—')}</td>
              <td style="text-align:right">${verifyAction(i)}</td>
            </tr>`).join('')}</tbody></table>
          </div>`).join('')
        : emptyState('Nothing to verify', 'Every physical constant has a confirmed value.')}
      </div>
      ${groupList.length > VERIFY_GROUP_CAP ? `<div class="tfoot"><span>Showing the first ${VERIFY_GROUP_CAP} of ${groupList.length} — narrow it with a tab above, or download the full list.</span></div>` : ''}
    </div>`);
}

/* ===================== COMMAND PALETTE ===================== */
let CMD_SEL = 0, CMD_ROWS = [];
function openCmd() {
  closeCmd();
  const scrim = el('<div class="scrim" id="cmdScrim"></div>');
  scrim.addEventListener('click', closeCmd);
  document.body.appendChild(scrim);
  const box = el(`<div class="cmd" id="cmdBox">
    <div class="cmd-i">${ic('srch')}<input id="cmdQ" placeholder="Jump to a section…" autocomplete="off"></div>
    <div class="cmd-l" id="cmdL"></div></div>`);
  document.body.appendChild(box);
  $('#cmdQ').addEventListener('input', paintCmd);
  $('#cmdQ').addEventListener('keydown', cmdKeys);
  paintCmd();
  $('#cmdQ').focus();
}
function closeCmd() {
  const s = $('#cmdScrim'); if (s) s.remove();
  const b = $('#cmdBox'); if (b) b.remove();
}
function paintCmd() {
  const q = ($('#cmdQ') ? $('#cmdQ').value : '').toLowerCase().trim();
  CMD_ROWS = NAV.filter(x => x.k && (!q || x.n.toLowerCase().includes(q)));
  CMD_SEL = Math.min(CMD_SEL, Math.max(0, CMD_ROWS.length - 1));
  $('#cmdL').innerHTML = CMD_ROWS.length
    ? `<div class="cmd-g">Sections</div>` + CMD_ROWS.map((x, i) =>
        `<button class="cmd-r ${i === CMD_SEL ? 'on' : ''}" data-cmd="${x.k}">${ic(x.i)}<span>${esc(x.n)}</span>
         ${i === CMD_SEL ? '<span class="k">↵</span>' : ''}</button>`).join('')
    : `<div class="cmd-g">No match</div>`;
  $all('[data-cmd]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.cmd; closeCmd(); goto(k); }));
}
function cmdKeys(e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); CMD_SEL = Math.min(CMD_SEL + 1, CMD_ROWS.length - 1); paintCmd(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); CMD_SEL = Math.max(CMD_SEL - 1, 0); paintCmd(); }
  else if (e.key === 'Enter') { e.preventDefault(); const r = CMD_ROWS[CMD_SEL]; if (r) { closeCmd(); goto(r.k); } }
  else if (e.key === 'Escape') { closeCmd(); }
}
$('#cmdBtn').addEventListener('click', openCmd);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); }
  else if (e.key === 'Escape') { closeCmd(); closeModal(); closeDrawer(); }
});

  if ((t = el2('[data-act="inv-cat"]'))) { STATE.inventory.cat = t.dataset.cat; renderInventory(); return; }

  // one of the row's own buttons, which have their own handlers above.
  if ((t = el2('[data-act="ing-open"]')) && !e.target.closest('button[data-act]')) {
    openIngredientDrawer(parseInt(t.dataset.id, 10)); return;
  }
  if ((t = el2('[data-act="receive"]'))) { openReceiveModal(t.dataset.id, t.dataset.name, t.dataset.unit); return; }
  if ((t = el2('[data-act="count"]'))) { openCountModal(t.dataset.id, t.dataset.name, t.dataset.baseunit, parseFloat(t.dataset.onhand)); return; }
  if ((t = el2('[data-act="use"]'))) { openUsageModal(t.dataset.id, t.dataset.name, t.dataset.baseunit); return; }
  if ((t = el2('[data-act="ing-edit"]'))) {
    const ing = STATE.inventory.data.find(x => x.id === parseInt(t.dataset.id, 10));
    if (ing) openEditIngredientModal(ing);
    return;
  }
  if ((t = el2('[data-act="inv-bulk"]'))) { openBulkUpdateModal(); return; }
  if ((t = el2('[data-act="inv-add"]'))) { openAddIngredientModal(); return; }
  if ((t = el2('[data-act="verify"]'))) { openVerifyModal(t.dataset.id, t.dataset.field, t.dataset.name, t.dataset.current); return; }
  if ((t = el2('[data-act="mv-prev"]'))) { STATE.movements.offset = Math.max(0, STATE.movements.offset - STATE.movements.limit); await fetchMovements(); return; }
  if ((t = el2('[data-act="mv-next"]'))) { STATE.movements.offset += STATE.movements.limit; await fetchMovements(); return; }
  if ((t = el2('[data-act="unli-date"]'))) { STATE.unli.date = $('#unliDate').value; await loadUnli(); return; }
  if ((t = el2('[data-act="unli-measure"]'))) { openUnliMeasureModal(t.dataset.key); return; }
  if ((t = el2('[data-act="unli-tolerance"]'))) { openUnliToleranceModal(); return; }
  if ((t = el2('[data-act="unli-flavor"]'))) { openFlavorModal(parseInt(t.dataset.id, 10)); return; }
  if ((t = el2('[data-act="unli-recal"]'))) {
    const dry = t.dataset.dry === '1';
    if (!dry && !confirm('Recalibrate the portion coefficients from the signed-off reconciliation history? The till will deduct against the new values from now on. Nothing already deducted changes.')) return;
    t.disabled = true;
    try { await runUnliRecalibration(dry); } catch (err) { showErr(err.message); } finally { t.disabled = false; }
    return;
  }
  if ((t = el2('[data-act="unli-review"]'))) {
    const approve = t.dataset.ok === '1';
    if (!approve && !confirm('Exclude this day from the portion coefficient? The stock correction it already posted stays as it is.')) return;
    t.disabled = true;
    try {
      await api(`/unli/reconciliation/${t.dataset.id}/review`, {
        method: 'POST', body: JSON.stringify({ approve }),
      });
      toast(approve ? 'Signed off — this day now counts toward the coefficient.'
                    : 'Excluded from the coefficient.');
      await loadUnli();
    } catch (err) { showErr(err.message); t.disabled = false; }
    return;
  }
  if ((t = el2('[data-act="export-unli"]'))) {
    const list = STATE.unli.history;
    if (!list || !list.length) { toast('Nothing to export.'); return; }
    downloadCsv('unli_reconciliation.csv', list, [
      { label: 'Service date', key: 'service_date' }, { label: 'Stream', key: 'label' },
      { label: 'Covers', key: 'heads' },
      { label: 'Weighed out', key: 'opening_base' }, { label: 'Topped up', key: 'added_base' },
      { label: 'Left over', key: 'closing_base' },
      { label: 'Measured (actual)', key: 'actual_base' },
      { label: 'Expected (provisional)', key: 'theoretical_base' },
      { label: 'Variance', key: 'variance_base' }, { label: 'Variance %', key: 'variance_pct' },
      { label: 'Per head', key: 'actual_per_head' }, { label: 'Unit', key: 'base_unit' },
      { label: 'Tolerance', key: 'tolerance_ratio' }, { label: 'Verdict', key: 'status' },
      { label: 'Stock correction', key: 'correction_base' },
      { label: 'Sign-off', key: 'validation_state' },
    ]);
    return;
  }
  if ((t = el2('[data-act="exp-window"]'))) { STATE.expiry.within = parseInt(t.dataset.w, 10); await loadExpiry(); return; }
  if ((t = el2('[data-act="rep-window"]'))) { STATE.reports.days = parseInt(t.dataset.w, 10); await fetchReports(); return; }
  if ((t = el2('[data-act="recipe-select"]'))) { STATE.recipes.selectedId = parseInt(t.dataset.id, 10); await loadRecipes(); return; }
  if ((t = el2('[data-act="recipe-add"]'))) { openAddRecipeModal(); return; }
  if ((t = el2('[data-act="menu-price"]'))) { openMenuPriceModal(parseInt(t.dataset.id, 10), t.dataset.name, parseFloat(t.dataset.price)); return; }
  if ((t = el2('[data-act="resolve-map"]'))) { openResolveModal(t.dataset.id, t.dataset.label); return; }
  if ((t = el2('[data-act="resolve-dismiss"]'))) { dismissUnmapped(t.dataset.id); return; }
  if ((t = el2('[data-act="verify-field"]'))) { STATE.verification.field = t.dataset.f; renderVerification(); return; }
  if ((t = el2('[data-act="demand-chart"]'))) { openDemandChartModal(parseInt(t.dataset.id, 10)); return; }
  if ((t = el2('[data-act="theme-set"]'))) { setTheme(t.dataset.t); return; }
  if ((t = el2('[data-act="export-verification"]'))) {
    const d = STATE.verification.data;
    if (!d || !d.items.length) { toast('Nothing to export.'); return; }
    downloadCsv('needs_verification.csv', d.items, [
      { label: 'Field', key: 'field' }, { label: 'Entity', key: 'entity_name' },
      { label: 'Current value', key: 'current_value' }, { label: 'Context', key: 'context' },
    ]);
    return;
  }
  if ((t = el2('[data-act="export-ledger"]'))) {
    const d = STATE.movements.data;
    if (!d || !d.entries.length) { toast('Nothing to export.'); return; }
    downloadCsv('stock_movements.csv', d.entries, [
      { label: 'When', key: 'created_at' }, { label: 'Ingredient', key: 'ingredient_name' }, { label: 'Reason', key: 'reason' },
      { label: 'Delta', key: 'delta_base' }, { label: 'Balance after', key: 'balance_after_base' }, { label: 'Note', key: 'note' },
    ]);
    return;
  }
  if ((t = el2('[data-act="export-sales"]'))) {
    const d = STATE.reports.data;
    if (!d || !d.by_item.length) { toast('Nothing to export.'); return; }
    downloadCsv('sales_by_item.csv', d.by_item, [
      { label: 'Item', key: 'name' }, { label: 'Qty sold', key: 'qty_sold' }, { label: 'Revenue', key: 'revenue' },
    ]);
    return;
  }
  if ((t = el2('[data-act="export-expiry"]'))) {
    const list = STATE.expiry.data;
    if (!list || !list.length) { toast('Nothing to export.'); return; }
    downloadCsv('expiring_stock.csv', list, [
      { label: 'Ingredient', key: 'ingredient_name' }, { label: 'Reference', key: 'lot_no' },
      { label: 'Amount', key: 'qty_base' }, { label: 'Unit', key: 'base_unit' },
      { label: 'Received', key: 'received_at' },
      { label: 'Tracking', key: 'tracking' },
      { label: 'Expires / est. storage life to', key: 'expires_at' },
      { label: 'Days left', key: 'days_to_expiry' },
    ]);
    return;
  }
  if ((t = el2('[data-act="export-depletion"]'))) {
    const list = STATE.forecasts.dep;
    if (!list || !list.length) { toast('Nothing to export.'); return; }
    downloadCsv('restocking_list.csv', list, [
      { label: 'Ingredient', key: 'name' }, { label: 'On hand', key: 'available_base' }, { label: 'Unit', key: 'base_unit' },
      { label: 'Used per day (avg)', key: 'avg_daily_consumption' }, { label: 'Days left', key: 'days_remaining' },
      { label: 'Delivery time (days)', key: 'lead_time_days' },
      { label: 'Suggested order', key: 'suggested_order_qty' }, { label: 'Order unit', key: 'suggested_order_unit' },
      { label: 'Status', key: 'risk' },
    ]);
    return;
  }
  if ((t = el2('[data-act="print-section"]'))) { window.print(); return; }
  if ((t = el2('[data-act="modal-cancel"]'))) { closeModal(); return; }
  if ((t = el2('[data-act="logout"]'))) { doLogout(); return; }
});
$('#work').addEventListener('change', async e => {
  const el2 = a => e.target.closest(a);
  let t;
  if ((t = el2('[data-act="mv-reason"]'))) { STATE.movements.reason = t.value; STATE.movements.offset = 0; await fetchMovements(); return; }
  if ((t = el2('[data-act="inv-blocked"]'))) { STATE.inventory.onlyBlocked = t.checked; renderInventory(); return; }
  if ((t = el2('[data-act="inv-cat-sel"]'))) { STATE.inventory.cat = t.value; renderInventory(); return; }
});
$('#work').addEventListener('input', e => {
  const t = e.target.closest('[data-bind="inv-q"]');
  if (!t) return;
  STATE.inventory.q = t.value;
  const pos = t.selectionStart;
  renderInventory();
  const again = $('[data-bind="inv-q"]');
  if (again) { again.focus(); again.setSelectionRange(pos, pos); }
});

/* ===================== BOOT ===================== */
$('#srchIco').innerHTML = ic('srch');
$('#refreshBtn').innerHTML = ic('refresh');
$('#railToggle').innerHTML = ic('panel');
applyTheme(localStorage.getItem(NS + 'theme') || 'system');
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', () => {
  if ((localStorage.getItem(NS + 'theme') || 'system') === 'system') applyTheme('system');
});

function boot() {
  if (TOKEN && ROLE && NAME && ALLOWED_ROLES.includes(ROLE)) {
    $('#login').style.display = 'none';
    $('#app').style.display = 'grid';
    $('#whoName').textContent = NAME;
    $('#whoRole').textContent = ROLE.charAt(0).toUpperCase() + ROLE.slice(1);
    $('#avatarIni').textContent = NAME.slice(0, 2).toUpperCase();
    if (localStorage.getItem(NS + 'rail') === 'sm') $('#app').classList.add('rail-sm');
    goto(location.hash.replace('#', '') || 'dashboard');
  } else if (TOKEN) {
    doLogout();
  } else if (new URLSearchParams(location.search).get('intro') !== 'done') {
    // Arriving cold at /console shows the branded sequence. Arriving from the
    // landing page's LOGIN button does not replay it — that page already ran
    // the full animation before handing over, and watching it twice in a row
    // is exactly the kind of delay the brief said to avoid.
    WingsIntro.play();
  }
}
boot();
</script>
</body>
