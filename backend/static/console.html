<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wings Theory — Operations Console</title>
<style>
/* ============================================================
   TOKENS
   Semantic colours carry TWO ramps: --x-fill for fills/dots/bars,
   --x-text for type on a wash (the raw fills fail contrast as text).
   ============================================================ */
:root{
  --amber:#F4B400; --amber-press:#DCA200; --amber-wash:#FEF6E0; --amber-text:#8A6100;
  --charcoal:#1F1F1F;
  --bg:#F7F8FA; --card:#FFFFFF; --sunken:#F2F4F7;
  --text:#2D2D2D; --text-2:#6B7280; --text-3:#9AA1AC;
  --border:#E5E7EB; --border-soft:#EFF1F4;

  --ok-fill:#34C759;   --ok-text:#1B6E3C;   --ok-wash:#EAF7EE;
  --warn-fill:#FF9500; --warn-text:#8A5000; --warn-wash:#FFF4E5;
  --bad-fill:#FF3B30;  --bad-text:#B3261E;  --bad-wash:#FEECEB;
  --info-fill:#3B82F6; --info-text:#1D4ED8; --info-wash:#EAF1FE;
  --fore-fill:#8B5CF6; --fore-text:#6D28D9; --fore-wash:#F1ECFE;

  --sh-1:0 1px 2px rgba(16,24,40,.05);
  --sh-2:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04);
  --sh-3:0 4px 12px rgba(16,24,40,.07),0 1px 3px rgba(16,24,40,.04);

  --r-card:12px; --r-btn:16px; --r-input:10px; --r-chip:6px;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px; --s6:48px;

  --sans:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Manrope",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;

  --rail:248px; --head:60px; --dur:200ms; --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
/* Dark ramp. Washes become deep tints and the *-text colours lighten —
   a dark chip using the light theme's dark-green label is unreadable. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --card:#191B1E; --sunken:#212429;
    --text:#E8EAED; --text-2:#9BA1AA; --text-3:#6E747D;
    --border:#2A2E34; --border-soft:#232629;
    --amber-wash:#2A2210; --amber-text:#F4B400;
    --ok-text:#5FD37F; --ok-wash:#14261A;
    --warn-text:#FFB24D; --warn-wash:#2A1F10;
    --bad-text:#FF8177; --bad-wash:#2B1614;
    --info-text:#7FAEFF; --info-wash:#141D2E;
    --fore-text:#B79BFB; --fore-wash:#1E1830;
    --sh-1:0 1px 2px rgba(0,0,0,.4);
    --sh-2:0 1px 3px rgba(0,0,0,.45);
    --sh-3:0 4px 14px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111214; --card:#191B1E; --sunken:#212429;
  --text:#E8EAED; --text-2:#9BA1AA; --text-3:#6E747D;
  --border:#2A2E34; --border-soft:#232629;
  --amber-wash:#2A2210; --amber-text:#F4B400;
  --ok-text:#5FD37F; --ok-wash:#14261A;
  --warn-text:#FFB24D; --warn-wash:#2A1F10;
  --bad-text:#FF8177; --bad-wash:#2B1614;
  --info-text:#7FAEFF; --info-wash:#141D2E;
  --fore-text:#B79BFB; --fore-wash:#1E1830;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 1px 3px rgba(0,0,0,.45);
  --sh-3:0 4px 14px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F7F8FA; --card:#FFFFFF; --sunken:#F2F4F7;
  --text:#2D2D2D; --text-2:#6B7280; --text-3:#9AA1AC;
  --border:#E5E7EB; --border-soft:#EFF1F4;
  --amber-wash:#FEF6E0; --amber-text:#8A6100;
  --ok-text:#1B6E3C; --ok-wash:#EAF7EE;
  --warn-text:#8A5000; --warn-wash:#FFF4E5;
  --bad-text:#B3261E; --bad-wash:#FEECEB;
  --info-text:#1D4ED8; --info-wash:#EAF1FE;
  --fore-text:#6D28D9; --fore-wash:#F1ECFE;
  --sh-1:0 1px 2px rgba(16,24,40,.05);
  --sh-2:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04);
  --sh-3:0 4px 12px rgba(16,24,40,.07),0 1px 3px rgba(16,24,40,.04);
  color-scheme:light;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.hide{display:none!important}
a{color:inherit}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ================= LOGIN ================= */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--charcoal);padding:20px;z-index:90}
.login-box{background:var(--card);border-radius:16px;padding:var(--s4) var(--s3);width:100%;max-width:370px;
  box-shadow:0 20px 50px rgba(0,0,0,.34)}
.login-mark{height:44px;display:inline-flex;align-items:center;margin-bottom:var(--s2)}
.login-mark img{height:100%;width:auto;display:block}
.login-box h1{font-size:20px;font-weight:600;margin:0 0 3px;letter-spacing:-.02em}
.login-box .lead{color:var(--text-3);font-size:13px;margin:0 0 var(--s3)}
.login-box label{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:5px}
.login-box .field{margin-bottom:var(--s2);height:42px;font-size:15px}
.pass-wrap{position:relative}
.login-box .pass-wrap{margin-bottom:var(--s2)}
.login-box .pass-wrap .field{margin-bottom:0;padding-right:40px}
.pass-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;
  padding:8px;border-radius:8px;display:flex;color:var(--text-3);cursor:pointer}
.pass-toggle:hover{color:var(--text)}
.pass-toggle svg{width:16px;height:16px;display:block}
#loginErr{color:var(--bad-text);font-size:12.5px;margin-top:10px;min-height:16px}

/* ================= SHELL ================= */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.app.rail-sm{--rail:64px}

.rail{background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.brand{height:var(--head);display:flex;align-items:center;gap:10px;
  padding:0 var(--s2);border-bottom:1px solid var(--border-soft);flex-shrink:0}
.brand-mark{height:30px;display:inline-flex;align-items:center;flex-shrink:0}
.brand-mark img{height:100%;width:auto;display:block}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;overflow:hidden;white-space:nowrap}
.brand-txt span{font-size:10px;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase}
.rail-sm .brand-txt{display:none}

.nav{flex:1;overflow-y:auto;padding:var(--s2) 10px;display:flex;flex-direction:column;gap:2px}
.nav-lbl{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);padding:var(--s2) 10px 6px}
.rail-sm .nav-lbl{opacity:0;height:20px;padding:0;overflow:hidden}
.nav-i{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;
  color:var(--text-2);font-size:13.5px;font-weight:500;width:100%;text-align:left;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);position:relative}
.nav-i svg{width:17px;height:17px;flex-shrink:0}
.nav-i span.lbl{white-space:nowrap;overflow:hidden}
.rail-sm .nav-i span.lbl{display:none}
.rail-sm .nav-i{justify-content:center;padding:9px}
.nav-i:hover{background:var(--sunken);color:var(--text)}
.nav-i.on{background:var(--amber-wash);color:var(--amber-text);font-weight:600}
.nav-i.on::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;
  background:var(--amber);border-radius:0 3px 3px 0}
.nav-i .badge{margin-left:auto;background:var(--bad-fill);color:#fff;font-size:10.5px;
  font-weight:600;padding:1px 6px;border-radius:99px;line-height:1.5}
.rail-sm .nav-i .badge{display:none}

.rail-foot{border-top:1px solid var(--border-soft);padding:10px;display:flex;
  align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:99px;background:var(--charcoal);color:var(--amber);
  display:grid;place-items:center;font-size:11.5px;font-weight:600;flex-shrink:0}
.who{display:flex;flex-direction:column;line-height:1.25;overflow:hidden;flex:1}
.who b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:11px;color:var(--text-3)}
.rail-sm .who,.rail-sm .rail-foot .icon-btn{display:none}

/* ================= HEADER ================= */
.main{display:flex;flex-direction:column;min-width:0}
.head{height:var(--head);border-bottom:1px solid var(--border);background:var(--card);
  display:flex;align-items:center;gap:var(--s2);padding:0 var(--s3);position:sticky;top:0;z-index:30}
.head h1{font-size:16px;font-weight:600;letter-spacing:-.015em;margin:0;white-space:nowrap}
.head-sub{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.head-r{margin-left:auto;display:flex;align-items:center;gap:var(--s1)}

.kbar{display:flex;align-items:center;gap:8px;background:var(--sunken);
  border:1px solid transparent;border-radius:var(--r-input);padding:6px 10px;
  color:var(--text-3);font-size:12.5px;min-width:230px;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
.kbar:hover{border-color:var(--border);background:var(--card)}
.kbar svg{width:15px;height:15px}
.kbar kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;border:1px solid var(--border);
  border-radius:4px;padding:1px 5px;background:var(--card);color:var(--text-3)}

.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--text-2);position:relative;transition:background var(--dur) var(--ease)}
.icon-btn:hover{background:var(--sunken);color:var(--text)}
.icon-btn svg{width:17px;height:17px}
.icon-btn.spin svg{animation:spin 700ms linear}
@keyframes spin{to{transform:rotate(360deg)}}

#errBanner{background:var(--bad-wash);color:var(--bad-text);padding:10px var(--s3);font-size:12.5px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-soft)}
#errBanner button{border:1px solid var(--bad-text);border-radius:7px;padding:4px 10px;
  font-size:11.5px;color:var(--bad-text);margin-left:auto}

.work{padding:var(--s3);display:flex;flex-direction:column;gap:var(--s3);flex:1;min-width:0}
.view{animation:enter var(--dur) var(--ease) both}
@keyframes enter{from{opacity:0;transform:scale(.985) translateY(4px)}to{opacity:1;transform:none}}

/* ================= PRIMITIVES ================= */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-1)}
.card-h{display:flex;align-items:flex-start;gap:var(--s2);padding:var(--s2) var(--s3);
  border-bottom:1px solid var(--border-soft)}
.card-h h2{font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em}
.card-h p{font-size:12px;color:var(--text-3);margin:2px 0 0;line-height:1.45}
.card-h .r{margin-left:auto;display:flex;gap:var(--s1);align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.card-b{padding:var(--s3)}
.card-b.tight{padding:var(--s2)}
.card.flat{box-shadow:none}

.sec-t{display:flex;align-items:baseline;gap:10px;margin-bottom:-8px;flex-wrap:wrap}
.sec-t h2{font-size:13px;font-weight:600;letter-spacing:.02em;margin:0;text-transform:uppercase;color:var(--text-2)}
.sec-t p{font-size:12.5px;color:var(--text-3);margin:0}
.sec-t .r{margin-left:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;
  border-radius:var(--r-btn);font-size:13px;font-weight:500;white-space:nowrap;position:relative;overflow:hidden;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),
             box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease)}
.btn svg{width:15px;height:15px}
.btn-p{background:var(--amber);color:#1F1F1F;font-weight:600;box-shadow:var(--sh-1)}
.btn-p:hover{background:var(--amber-press);box-shadow:var(--sh-2)}
.btn-s{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-s:hover{background:var(--sunken);border-color:var(--text-3)}
.btn-d{background:var(--bad-fill);color:#fff;font-weight:600}
.btn-d:hover{filter:brightness(.93)}
.btn-g{color:var(--text-2)}
.btn-g:hover{background:var(--sunken);color:var(--text)}
.btn:active{transform:scale(.98)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px}
.btn-lg{height:44px;padding:0 20px;font-size:15px;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.ripple{position:absolute;border-radius:99px;transform:scale(0);background:rgba(0,0,0,.13);
  animation:rip 450ms var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:2px 8px;border-radius:var(--r-chip);white-space:nowrap;line-height:1.6}
.chip::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;flex-shrink:0}
.chip.no-dot::before{display:none}
.chip.ok,.chip.c-ok{background:var(--ok-wash);color:var(--ok-text)}
.chip.warn,.chip.c-warn{background:var(--warn-wash);color:var(--warn-text)}
.chip.bad,.chip.c-bad{background:var(--bad-wash);color:var(--bad-text)}
.chip.info,.chip.c-info{background:var(--info-wash);color:var(--info-text)}
.chip.fore,.chip.c-fore{background:var(--fore-wash);color:var(--fore-text)}
.chip.mute,.chip.c-mute{background:var(--sunken);color:var(--text-2)}
.chip.amber,.chip.c-amber{background:var(--amber-wash);color:var(--amber-text)}

.tabs{display:flex;gap:2px;background:var(--sunken);padding:3px;border-radius:10px;width:fit-content;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--text-2);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.tab.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:var(--sh-1)}

.field{height:36px;border:1px solid var(--border);border-radius:var(--r-input);background:var(--card);
  padding:0 11px;font-size:13px;width:100%;transition:border-color var(--dur) var(--ease)}
.field:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-wash)}
.field::placeholder{color:var(--text-3)}
.field-sm{height:32px;border:1px solid var(--border);border-radius:9px;background:var(--card);
  padding:0 10px;font-size:12.5px;color:var(--text)}
.field-sm:focus{outline:none;border-color:var(--amber)}
.search{position:relative;display:inline-block}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:var(--text-3);pointer-events:none}
.search .field-sm{padding-left:31px}
.check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);white-space:nowrap}

/* ================= METRICS ================= */
.grid{display:grid;gap:var(--s2)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
.g-split{grid-template-columns:minmax(0,1.05fr) minmax(0,1.35fr);align-items:start}

.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);
  padding:var(--s2);display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh-1);
  transition:box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease)}
.kpi.act{cursor:pointer}
.kpi.act:hover{box-shadow:var(--sh-3);transform:translateY(-1px)}
.kpi .l,.kpi-t{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);font-weight:500}
.kpi .l svg,.kpi-t svg{width:14px;height:14px;color:var(--text-3);flex-shrink:0}
.kpi .v,.kpi-v{font-size:26px;font-weight:600;letter-spacing:-.025em;line-height:1.1;
  font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px;overflow-wrap:anywhere}
.kpi .v small,.kpi-v small{font-size:13px;font-weight:500;color:var(--text-3);letter-spacing:0}
.kpi .f,.kpi-f{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);margin-top:auto;
  overflow-wrap:anywhere;line-height:1.4}

/* attention band — deliberately dominant, and empty on a good day */
.att{border:1px solid var(--border);border-radius:var(--r-card);background:var(--card);overflow:hidden;box-shadow:var(--sh-1)}
.att-h{display:flex;align-items:center;gap:10px;padding:13px var(--s3);border-bottom:1px solid var(--border-soft)}
.att-h .pulse{width:8px;height:8px;border-radius:99px;background:var(--bad-fill);flex-shrink:0;
  box-shadow:0 0 0 0 rgba(255,59,48,.5);animation:pl 2.4s ease-out infinite}
@keyframes pl{70%{box-shadow:0 0 0 7px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}
.att-h h2{font-size:14px;font-weight:600;margin:0}
.att-h .n{font-size:12px;color:var(--text-3);margin-left:auto}
.att-l{display:flex;flex-direction:column}
.att-i{display:grid;grid-template-columns:34px 1fr auto;gap:var(--s2);align-items:center;
  padding:13px var(--s3);border-bottom:1px solid var(--border-soft);text-align:left;width:100%;
  transition:background var(--dur) var(--ease)}
.att-i:last-child{border-bottom:0}
.att-i:hover{background:var(--sunken)}
.att-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.att-ic svg{width:16px;height:16px}
.att-x b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.005em}
.att-x span{font-size:12.5px;color:var(--text-2)}
.att-m{display:flex;align-items:center;gap:10px;flex-shrink:0;color:var(--text-3)}
.att-m svg{width:15px;height:15px}

.empty{padding:var(--s5) var(--s3);text-align:center;display:flex;flex-direction:column;
  align-items:center;gap:12px}
.empty svg{width:38px;height:38px;color:var(--ok-text);opacity:.85}
.empty b{font-size:14px;font-weight:600}
.empty p{font-size:12.5px;color:var(--text-3);margin:0;max-width:320px;line-height:1.5}

/* note / callout */
.note{border-radius:10px;padding:13px var(--s2);display:flex;gap:11px;align-items:flex-start;
  background:var(--fore-wash)}
.note svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;color:var(--fore-text)}
.note b{font-size:12.5px;font-weight:600;display:block;color:var(--fore-text)}
.note p{font-size:12.5px;color:var(--text-2);margin:3px 0 0;line-height:1.5}
.note.info{background:var(--info-wash)} .note.info svg,.note.info b{color:var(--info-text)}
.note.bad{background:var(--bad-wash)} .note.bad svg,.note.bad b{color:var(--bad-text)}

/* ================= TABLE ================= */
.tw{overflow:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;min-width:640px}
thead th{position:sticky;top:0;background:var(--card);z-index:2;text-align:left;
  font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);
  padding:9px var(--s2);border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
tbody td{padding:10px var(--s2);border-bottom:1px solid var(--border-soft);vertical-align:middle;
  color:var(--text-2);white-space:nowrap}
tbody tr{transition:background 120ms var(--ease)}
tbody tr:hover{background:var(--sunken)}
tbody tr.sel{background:var(--amber-wash)}
tbody tr:last-child td{border-bottom:0}
td.nm,.nm{color:var(--text);font-weight:500}
td.n{font-variant-numeric:tabular-nums;text-align:right;color:var(--text)}
th.n{text-align:right}
td.wrap{white-space:normal;min-width:190px}
.sub{font-size:11.5px;color:var(--text-3);font-weight:400}
.tfoot{display:flex;align-items:center;gap:var(--s2);padding:10px var(--s2);
  border-top:1px solid var(--border-soft);font-size:12.5px;color:var(--text-3)}
.tfoot .r{margin-left:auto;display:flex;gap:6px;align-items:center}

/* ================= PROGRESS ================= */
.prog{display:flex;flex-direction:column;gap:6px}
.prog-t{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
.prog-t b{font-weight:500;color:var(--text)}
.prog-t span{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text-2);font-size:12px}
.prog-b{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.prog-b i{display:block;height:100%;border-radius:99px;width:0;transition:width 700ms var(--ease)}

/* ================= FEFO BATCH CARD ================= */
.batch{border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;
  flex-direction:column;gap:9px;background:var(--card);border-left-width:3px;
  transition:box-shadow var(--dur) var(--ease)}
.batch:hover{box-shadow:var(--sh-2)}
.batch-h{display:flex;align-items:baseline;gap:8px}
.batch-h b{font-size:13px;font-weight:600}
.batch-h .lot{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.batch-h .d{margin-left:auto;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.shelf{height:5px;border-radius:99px;background:var(--sunken);overflow:hidden}
.shelf i{display:block;height:100%;border-radius:99px}
.batch-m{display:flex;gap:12px;font-size:11.5px;color:var(--text-3);flex-wrap:wrap;align-items:center}
.batch-m span{font-variant-numeric:tabular-nums}

.verify-group{border:1px solid var(--border);border-radius:10px;padding:12px}
.verify-group table{width:100%;border-collapse:collapse}
.verify-group td{padding:5px 6px;font-size:12.5px;border-top:1px solid var(--border)}
.verify-group tr:first-child td{border-top:none}

/* ================= MODAL ================= */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.32);z-index:60;opacity:0;
  animation:fade var(--dur) var(--ease) forwards;backdrop-filter:blur(1px)}
@keyframes fade{to{opacity:1}}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);
  border:1px solid var(--border);border-radius:14px;padding:var(--s3);width:min(430px,92vw);z-index:61;
  box-shadow:0 20px 60px rgba(16,24,40,.24);max-height:86vh;overflow-y:auto;
  animation:pop 200ms var(--ease) both}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal h3{margin:0 0 4px;font-size:16px;font-weight:600;letter-spacing:-.015em}
.modal>p{margin:0 0 var(--s2);font-size:12.5px;color:var(--text-3);line-height:1.5}
.modal label{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin:var(--s2) 0 5px}
.modal .actions{display:flex;gap:var(--s1);margin-top:var(--s3)}
.modal .actions .btn{flex:1}
#modalErr{color:var(--bad-text);font-size:12.5px;margin-top:10px;display:none}

/* ================= DRAWER ================= */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--card);
  border-left:1px solid var(--border);z-index:61;display:flex;flex-direction:column;
  animation:slide 240ms var(--ease) both;box-shadow:-8px 0 28px rgba(16,24,40,.14)}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
.dr-h{display:flex;align-items:center;gap:10px;padding:var(--s2) var(--s3);
  border-bottom:1px solid var(--border-soft);flex-shrink:0}
.dr-h h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.dr-h .r{margin-left:auto;display:flex;gap:6px}
.dr-b{flex:1;overflow-y:auto;padding:var(--s3);display:flex;flex-direction:column;gap:var(--s3)}
.dr-f{padding:var(--s2) var(--s3);border-top:1px solid var(--border-soft);display:flex;gap:var(--s1);flex-shrink:0}
.dr-t{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:10px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px var(--s2);font-size:12.5px;align-items:center}
.dl dt{color:var(--text-3)}
.dl dd{margin:0;color:var(--text);text-align:right;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:7px;justify-content:flex-end;flex-wrap:wrap}
.act-row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.act-row .field{width:96px;flex-shrink:0;text-align:right}
.act-row .lbl{font-size:12px;color:var(--text-2);flex:1;line-height:1.35}
.act-row .btn{flex-shrink:0;min-width:112px}
.tl{display:flex;flex-direction:column;position:relative}
.tl-i{display:grid;grid-template-columns:24px 1fr;gap:11px;padding-bottom:15px;position:relative}
.tl-i:not(:last-child)::before{content:"";position:absolute;left:11px;top:22px;bottom:0;
  width:1.5px;background:var(--border)}
.tl-d{width:24px;height:24px;border-radius:99px;display:grid;place-items:center;
  background:var(--sunken);z-index:1;border:2px solid var(--card)}
.tl-d svg{width:12px;height:12px}
.tl-x b{display:block;font-size:12.5px;font-weight:600}
.tl-x span{font-size:11.5px;color:var(--text-3)}
.tl-x .amt{font-family:var(--mono);font-size:11.5px}
tbody tr.row-link{cursor:pointer}

.cmd{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(600px,92vw);
  background:var(--card);border:1px solid var(--border);border-radius:14px;z-index:61;
  box-shadow:0 20px 60px rgba(16,24,40,.22);overflow:hidden;animation:cpop 200ms var(--ease) both}
@keyframes cpop{from{opacity:0;transform:translateX(-50%) scale(.98) translateY(-6px)}

.cmd-i{display:flex;align-items:center;gap:11px;padding:14px var(--s2);border-bottom:1px solid var(--border-soft)}
.cmd-i svg{width:17px;height:17px;color:var(--text-3);flex-shrink:0}
.cmd-i input{border:0;background:none;flex:1;font-size:15px;outline:none}
.cmd-i input::placeholder{color:var(--text-3)}
.cmd-l{max-height:min(420px,54vh);overflow-y:auto;padding:6px}
.cmd-g{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-3);padding:9px 11px 5px}
.cmd-r{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;width:100%;
  text-align:left;font-size:13.5px}
.cmd-r svg{width:15px;height:15px;color:var(--text-3);flex-shrink:0}
.cmd-r.on{background:var(--amber-wash)}
.cmd-r.on svg{color:var(--amber-text)}
.cmd-r .k{margin-left:auto;font-size:11px;color:var(--text-3)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--charcoal);
  color:#fff;padding:11px 17px;border-radius:11px;font-size:13px;z-index:80;display:flex;
  align-items:center;gap:9px;box-shadow:0 8px 26px rgba(0,0,0,.28);animation:tst 240ms var(--ease) both;
  max-width:min(520px,92vw);transition:opacity 240ms var(--ease)}
@keyframes tst{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%)}}
.toast svg{width:16px;height:16px;color:var(--ok-fill);flex-shrink:0}

/* ================= CHART ================= */
.chart{width:100%;display:block;overflow:visible}
.chart .grid-l{stroke:var(--border-soft);stroke-width:1}
.chart .ax{fill:var(--text-3);font-size:10.5px;font-family:var(--sans)}
.chart .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.chart .dash{stroke-dasharray:4 4}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text-2);margin-top:10px}
.legend span.it{display:flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:3px;border-radius:2px}
.legend .sw.sq{width:9px;height:9px;border-radius:2px}

/* ================= RESPONSIVE ================= */
.mob-nav{display:none}
@media (max-width:1180px){
  .g-side,.g-split{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .work{padding:var(--s2);padding-bottom:78px;gap:var(--s2)}
  .g3,.g2{grid-template-columns:1fr}
  .head{padding:0 var(--s2)}
  .head-sub{max-width:40vw}
  .kbar{min-width:0;width:34px;padding:6px;justify-content:center}
  .kbar span,.kbar kbd{display:none}
  .mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);
    border-top:1px solid var(--border);z-index:50;padding:6px 4px 8px;justify-content:space-around}
  .mob-i{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 9px;
    border-radius:9px;color:var(--text-3);font-size:10px;font-weight:500;min-width:56px}
  .mob-i svg{width:20px;height:20px}
  .mob-i.on{color:var(--amber-text)}
}
@media (max-width:620px){ .g4{grid-template-columns:1fr} }

@media print{
  .rail,.head,#errBanner,.mob-nav,.btn,.tabs,.toast{display:none!important}
  .app{display:block}
  .work{padding:0;gap:14px}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid}
  body{font-size:11px;background:#fff}
}

/* ===================== CHART ENGINE (hand-rolled SVG) ===================== */
const CV = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const uid = () => 'g' + Math.random().toString(36).slice(2, 8);

/* Catmull-Rom → cubic bezier: smoothing without overshoot */
function smooth(pts) {
  if (pts.length < 2) return pts.length ? `M${pts[0][0]},${pts[0][1]}` : '';
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2, t = .18;
    d += ` C${p1[0] + (p2[0] - p0[0]) * t},${p1[1] + (p2[1] - p0[1]) * t} ${p2[0] - (p3[0] - p1[0]) * t},${p2[1] - (p3[1] - p1[1]) * t} ${p2[0]},${p2[1]}`;
  }
  return d;
}

/* opts: {h, band:[{x,lo,hi}], series:[{name,color,data:[{x,y}],dash,fill,w,dot}], yfmt, xlab, split} */
function lineChart(o) {
  const W = 1000, H = o.h || 240, ML = 44, MR = 12, MT = 14, MB = 26;
  const all = o.series.flatMap(s => s.data.map(p => p.y)).concat(o.band ? o.band.flatMap(b => [b.lo, b.hi]) : []);
  if (!all.length) return '';
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * .16 || 1; lo = Math.max(0, lo - pad); hi = hi + pad;
  const xs = o.series.flatMap(s => s.data.map(p => p.x));
  const xmin = Math.min(...xs), xmax = Math.max(...xs, ...(o.band ? o.band.map(b => b.x) : []));
  const X = x => ML + (x - xmin) / (xmax - xmin || 1) * (W - ML - MR);
  const Y = y => MT + (1 - (y - lo) / (hi - lo || 1)) * (H - MT - MB);
  const ticks = 4, g = [];
  for (let i = 0; i <= ticks; i++) {
    const v = lo + (hi - lo) * i / ticks, y = Y(v);

      <text class="ax" x="${ML - 7}" y="${y + 3.5}" text-anchor="end">${o.yfmt ? o.yfmt(v) : v.toFixed(0)}</text>`);
  }
  let band = '';
  if (o.band && o.band.length) {
    const up = o.band.map(b => [X(b.x), Y(b.hi)]), dn = o.band.map(b => [X(b.x), Y(b.lo)]).reverse();
    band = `<path d="${smooth(up)} L${dn[0][0]},${dn[0][1]} ${dn.slice(1).map(p => `L${p[0]},${p[1]}`).join(' ')} Z"
      fill="${o.bandColor || CV('--fore-fill')}" opacity=".13"/>`;
  }
  let split = '';
  if (o.split !== undefined) {
    const x = X(o.split);
    split = `<line x1="${x}" y1="${MT}" x2="${x}" y2="${H - MB}" stroke="${CV('--text-3')}"
      stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>
      <text class="ax" x="${x + 5}" y="${MT + 9}">forecast →</text>`;
  }
  const paths = o.series.map(s => {
    if (!s.data.length) return '';
    const pts = s.data.map(p => [X(p.x), Y(p.y)]), id = uid();
    let fill = '';
    if (s.fill) {
      fill = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${s.color}" stop-opacity=".20"/>
        <stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>
        <path d="${smooth(pts)} L${pts[pts.length - 1][0]},${H - MB} L${pts[0][0]},${H - MB} Z" fill="url(#${id})"/>`;
    }
    const last = pts[pts.length - 1];
    return `<g>${fill}<path class="ln ${s.dash ? 'dash' : ''}" d="${smooth(pts)}" stroke="${s.color}" stroke-width="${s.w || 2}"/>
      ${s.dot !== false ? `<circle cx="${last[0]}" cy="${last[1]}" r="3.4" fill="${s.color}" stroke="${CV('--card')}" stroke-width="2"/>` : ''}</g>`;
  }).join('');
  const xl = (o.xlab || []).map(t => `<text class="ax" x="${X(t.x)}" y="${H - 8}" text-anchor="middle">${esc(t.l)}</text>`).join('');
  const marks = (o.marks || []).map(m => `<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="4.2"
    fill="${m.color || CV('--bad-fill')}" stroke="${CV('--card')}" stroke-width="1.6"><title>${esc(m.t || '')}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">${g.join('')}${band}${split}${paths}${marks}${xl}</svg>`;
}

function bars(data, h = 200, color, fmt) {
  if (!data.length) return '';
  const W = 1000, ML = 46, MR = 12, MT = 12, MB = 26, n = data.length;
  const hi = Math.max(...data.map(d => d.v), 1) * 1.12;
  const gap = (W - ML - MR) / n, bw = Math.max(3, gap * .62);
  const fm = fmt || (v => v >= 1000 ? (v / 1000).toFixed(0) + 'k' : v.toFixed(0));
  let g = '';
  for (let i = 0; i <= 3; i++) {
    const v = hi * i / 3, y = MT + (1 - i / 3) * (h - MT - MB);
    g += `<line class="grid-l" x1="${ML}" y1="${y}" x2="${W - MR}" y2="${y}"/>
      <text class="ax" x="${ML - 7}" y="${y + 3.5}" text-anchor="end">${fm(v)}</text>`;
  }
  const bs = data.map((d, i) => {
    const bh = Math.max(0, (d.v / hi) * (h - MT - MB)), x = ML + i * gap + (gap - bw) / 2, y = h - MB - bh;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${d.c || color || CV('--info-fill')}">
      <animate attributeName="height" from="0" to="${bh}" dur="560ms" fill="freeze" calcMode="spline" keySplines=".32 .72 0 1"/>
      <animate attributeName="y" from="${h - MB}" to="${y}" dur="560ms" fill="freeze" calcMode="spline" keySplines=".32 .72 0 1"/>
      <title>${esc(d.l)}: ${esc(d.t || fm(d.v))}</title></rect>
      ${n <= 32 ? `<text class="ax" x="${x + bw / 2}" y="${h - 8}" text-anchor="middle">${esc(d.l)}</text>` : ''}`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" style="height:${h}px">${g}${bs}</svg>`;
}

function donut(segs, size = 150, label) {
  const r = size / 2 - 13, cx = size / 2, cy = size / 2, C = 2 * Math.PI * r;
  let off = 0;
  const arcs = segs.map(s => {
    const len = Math.max(0, s.v) * C;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="13"
      stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"
      stroke-linecap="butt"><title>${esc(s.l || '')}</title></circle>`;
    off += len; return el;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex-shrink:0">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${CV('--sunken')}" stroke-width="13"/>${arcs}
    ${label ? `<text x="${cx}" y="${cy - 1}" text-anchor="middle" font-size="20" font-weight="600" fill="${CV('--text')}" font-family="${CV('--sans')}">${esc(label.v)}</text>
    <text x="${cx}" y="${cy + 15}" text-anchor="middle" font-size="10" fill="${CV('--text-3')}" font-family="${CV('--sans')}">${esc(label.l)}</text>` : ''}</svg>`;
}

function spark(vals, color, h = 30) {
  if (!vals.length) return '';
  const W = 120, pad = 2, lo = Math.min(...vals), hi = Math.max(...vals);
  const pts = vals.map((v, i) => [pad + (vals.length === 1 ? 0 : i / (vals.length - 1)) * (W - pad * 2),
    pad + (1 - (v - lo) / ((hi - lo) || 1)) * (h - pad * 2)]);
  return `<svg viewBox="0 0 ${W} ${h}" style="width:${W}px;height:${h}px" fill="none" aria-hidden="true">
    <path d="${smooth(pts)}" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="2.2" fill="${color}"/></svg>`;
}

function esc(s) {

/* ===================== AUTH =====================
   Namespaced per app so a cashier/kitchen login elsewhere on this device
   never silently satisfies this console's auto-login check. */
const NS = 'wt_console_';
const ALLOWED_ROLES = ['manager', 'admin'];
let TOKEN = localStorage.getItem(NS + 'token');
let ROLE = localStorage.getItem(NS + 'role');
let NAME = localStorage.getItem(NS + 'name');

async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  const authed = !!TOKEN;
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  let body = null;
  try { body = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) {
    if (res.status === 401 && authed) doLogout();
    throw new Error(apiErrorMessage(body, res.status));
  }
  return body;
}

/* Two different error shapes come back from this backend:
     FastAPI HTTPException -> { detail: "a string" }
     domain WTError        -> { code, message: "a string", detail: {...} }
   The old code read `body.detail || body.message`, but a WTError with no
   extra context carries `detail: {}` — an EMPTY OBJECT, which is truthy in
   JavaScript — so it won every time and the operator was shown a literal
   "{}" instead of the actual reason. Prefer a real human message; only fall
   back to detail when it is genuinely a non-empty string. */
function apiErrorMessage(body, status) {
  if (body) {
    if (typeof body.message === 'string' && body.message) return body.message;
    if (typeof body.detail === 'string' && body.detail) return body.detail;
  }
  if (status === 401) return 'Session expired — please sign in again.';
  if (status === 403) return 'Your account does not have permission for this.';
  return 'HTTP ' + status;
}

async function doLogin() {
  const u = $('#luser').value.trim(), p = $('#lpass').value;
  const err = $('#loginErr');
  err.textContent = '';
  if (!u || !p) { err.textContent = 'Enter a username and password.'; return; }
  $('#loginBtn').disabled = true;
  try {
    const d = await api('/auth/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
    if (!ALLOWED_ROLES.includes(d.role)) {
      err.textContent = `This console is for managers and admins only (your role: ${d.role}).`;
      return;
    }
    TOKEN = d.token; ROLE = d.role; NAME = d.display_name || u;
    localStorage.setItem(NS + 'token', TOKEN);
    localStorage.setItem(NS + 'role', ROLE);
    localStorage.setItem(NS + 'name', NAME);
    boot();
  } catch (e) {
    err.textContent = e.message;
  } finally {
    $('#loginBtn').disabled = false;
  }
}
function doLogout() {
  localStorage.removeItem(NS + 'token'); localStorage.removeItem(NS + 'role'); localStorage.removeItem(NS + 'name');
  TOKEN = ROLE = NAME = null;
  $('#app').style.display = 'none';
  $('#login').style.display = 'flex';
  $('#lpass').value = '';
}
$('#loginBtn').addEventListener('click', doLogin);
$('#lpass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function barChart(items, opt) {

  const data = items.map(i => ({

function downloadCsv(filename, rowsArr, cols) {
  const q = v => `"${String(v === undefined || v === null ? '' : v).replace(/"/g, '""')}"`;
  const lines = [cols.map(c => q(c.label)).join(',')]
    .concat(rowsArr.map(r => cols.map(c => q(typeof c.get === 'function' ? c.get(r) : r[c.key])).join(',')));
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

        </div>
        <div class="act-row">
          <input class="field" id="drCount" type="number" min="0" step="0.01" value="${num(i.on_hand_base, 2)}">
          <span class="lbl">${esc(i.base_unit)} counted</span>
          <button class="btn btn-s btn-sm" id="drCountBtn">${ic('scale')}Adjust</button>
        </div>
        ${i.inventory_type === 'operational_supply' ? `
        <div class="act-row">
          <input class="field" id="drUse" type="number" min="0.01" step="0.01" value="1">
          <span class="lbl">${esc(i.base_unit)} used</span>
          <button class="btn btn-s btn-sm" id="drUseBtn">${ic('pkg')}Record use</button>
        </div>` : ''}
        <div class="act-row">
          <input class="field" id="drWaste" type="number" min="0" step="0.01" value="0">
          <span class="lbl">${esc(i.base_unit)} thrown away</span>
          <button class="btn btn-d btn-sm" id="drWasteBtn">${ic('warn')}Log waste</button>
        </div>
        <div id="drErr" style="color:var(--bad-text);font-size:12.5px;display:none;margin-top:4px"></div>
      </div>

      <div>
        <div class="dr-t">Used in ${d.used_in.length} recipe${d.used_in.length === 1 ? '' : 's'}</div>
        ${d.used_in.length ? `<dl class="dl">${d.used_in.slice(0, 12).map(u =>
          `<dt>${esc(u.name)}${u.kind === 'sub_recipe' ? ' <span class="sub">(house-made)</span>' : ''}</dt>
           <dd>${num(u.qty_base, 3)} ${esc(i.base_unit)}</dd>`).join('')}</dl>
          ${d.used_in.length > 12 ? `<div class="sub" style="margin-top:8px">+ ${d.used_in.length - 12} more</div>` : ''}`
        : `<p class="sub" style="margin:0">Not used by any recipe yet.</p>`}
      </div>

      <div>
        <div class="dr-t">Stock movements</div>
        ${d.movements.length ? `<div class="tl">${d.movements.slice(0, 12).map(m => {
          const up = m.delta_base > 0;
          return `<div class="tl-i">
            <div class="tl-d" style="color:${up ? 'var(--ok-text)' : 'var(--bad-text)'}">${ic(up ? 'up' : 'down')}</div>
            <div class="tl-x"><b>${esc(reasonLabel(m.reason))}</b>
              <span class="amt" style="color:${up ? 'var(--ok-text)' : 'var(--bad-text)'}">${up ? '+' : ''}${num(m.delta_base, 2)} ${esc(i.base_unit)}</span>
              <span> · left ${num(m.balance_after_base, 2)} ${esc(i.base_unit)}</span>
              <span style="display:block">${esc(m.created_at)}${m.note ? ' · ' + esc(m.note) : ''}</span></div>
          </div>`;
        }).join('')}</div>` : `<p class="sub" style="margin:0">No movements yet.</p>`}
      </div>
    </div>
    <div class="dr-f"><button class="btn btn-s" style="flex:1" data-act="drawer-close">Close</button></div>`);

  const err = m => { const e = $('#drErr'); if (e) { e.textContent = m; e.style.display = 'block'; } };
  const run = async (btnId, fn) => {
    const b = $(btnId); if (!b) return;
    b.addEventListener('click', async () => {
      b.disabled = true;
      try { await fn(); }
      catch (e) { err(e.message); }
      finally { const bb = $(btnId); if (bb) bb.disabled = false; }
    });
  };
  run('#drRecvBtn', async () => {
    const q = parseFloat($('#drRecv').value);
    if (!q || q <= 0) return err('Enter an amount greater than zero.');
    const r = await api(`/console/ingredients/${i.id}/receive`, {
      method: 'POST', body: JSON.stringify({ purchase_qty: q }) });
    toast(`Received ${r.received_base} ${r.base_unit} of ${r.name}.`);
    await refreshAfterDrawerAction(i.id);
  });
  run('#drCountBtn', async () => {
    const q = parseFloat($('#drCount').value);
    if (isNaN(q) || q < 0) return err('Enter a number, zero or more.');
    const r = await api(`/console/ingredients/${i.id}/count`, {
      method: 'POST', body: JSON.stringify({ actual_base: q }) });
    toast(Math.abs(r.variance_base) < 0.01 ? 'Confirmed — matches what was expected.'
      : `Recorded: ${Math.abs(r.variance_base).toFixed(2)} ${r.base_unit} ${r.variance_base > 0 ? 'more' : 'less'} than expected.`);
    await refreshAfterDrawerAction(i.id);
  });
  run('#drWasteBtn', async () => {
    const q = parseFloat($('#drWaste').value);
    if (!q || q <= 0) return err('Enter an amount greater than zero.');
    if (!confirm(`Write off ${q} ${i.base_unit} of ${i.name} as thrown away? This cannot be undone — it is recorded permanently in the ledger.`)) return;
    const r = await api(`/console/ingredients/${i.id}/waste`, {
      method: 'POST', body: JSON.stringify({ qty_base: q, reason: 'wastage' }) });
    toast(`Wrote off ${r.wasted_base} ${r.base_unit} of ${r.name}.`);
    await refreshAfterDrawerAction(i.id);
  });
  run('#drUseBtn', async () => {
    const q = parseFloat($('#drUse').value);
    if (!q || q <= 0) return err('Enter an amount greater than zero.');
    const r = await api(`/console/ingredients/${i.id}/use`, {
      method: 'POST', body: JSON.stringify({ qty_base: q }) });
    toast(`Used ${r.used_base} ${r.base_unit} of ${r.name}.`);
    await refreshAfterDrawerAction(i.id);
  });
}

    $('#recProducesWrap').style.display = isMenu ? 'none' : 'block';

  $('#recAddLine').addEventListener('click', () => {
    $('#recLines').insertAdjacentHTML('beforeend', lineRowHtml());
  });
  box.addEventListener('click', e => {
    const rm = e.target.closest('.rl-remove');
    if (rm) rm.closest('.recline').remove();
  });
  box.addEventListener('change', e => {
    const sel = e.target.closest('.rl-ing');
    if (!sel) return;
    const row = sel.closest('.recline');
    const chosen = byId[parseInt(sel.value, 10)];
    row.querySelector('.rl-unit').textContent = chosen ? chosen.base_unit : '';
  });
  $('#recSubmit').addEventListener('click', async () => {
    const name = $('#recName').value.trim();
    if (!name) { modalError('Enter a name.'); return; }
    const kind = $('#recKind').value;
    const lines = [];
    for (const row of box.querySelectorAll('.recline')) {
      const ingredientPk = parseInt(row.querySelector('.rl-ing').value, 10);
      const qty = parseFloat(row.querySelector('.rl-qty').value);
      const label = row.querySelector('.rl-label').value.trim();
      if (!qty || qty <= 0) continue;
      lines.push({
        ingredient_pk: ingredientPk, qty_base: qty,
        display_label: label || (byId[ingredientPk] ? byId[ingredientPk].name : 'ingredient'),
      });
    }
    if (!lines.length) { modalError('Add at least one ingredient line with an amount.'); return; }
    const body = {
      name, kind, yield_qty: parseFloat($('#recYieldQty').value) || 1,
      yield_unit: $('#recYieldUnit').value.trim() || 'serving', lines,
    };
    if (kind === 'sub_recipe') {
      const produces = $('#recProduces').value;
      if (!produces) { modalError('Pick which ingredient this recipe produces.'); return; }
      body.produces_ingredient_pk = parseInt(produces, 10);
    }
    $('#recSubmit').disabled = true;
    try {
      await api('/console/recipes', { method: 'POST', body: JSON.stringify(body) });
      closeModal(); toast(`Added recipe: ${name}.`);
      if (CURRENT) goto(CURRENT);
    } catch (e) { modalError(e.message); }
    finally { const b = $('#recSubmit'); if (b) b.disabled = false; }
  });
}

  anomaly: { losses: [], consumption: [] },
  unli: { date: null, pending: null, history: [], coefficients: [], tolerance: 0.1 },
};
const MIN_DEMAND_DAYS = 7;

function inventoryValuation() {
  const list = STATE.inventory.data || [];
  let total = 0, priced = 0; const missing = [];
  list.forEach(i => {
    if (i.unit_cost != null && i.pack_size) { total += (i.unit_cost / (i.pack_size * (i.yield_factor || 1))) * i.on_hand_base; priced++; }
    else missing.push(i.name);
  });
  return { total, priced, total_count: list.length, missing };
}

async function loadInventory() {
  const [d, dep] = await Promise.all([
    api('/console/ingredients?limit=500'),
    api('/console/forecasts/depletion?lookback_days=30'),
  ]);
  STATE.inventory.data = d.ingredients;
  STATE.inventory.dep = {};
  dep.ingredients.forEach(x => { STATE.inventory.dep[x.ingredient_id] = x; });
  renderInventory();
}
const CAT_LABELS = { '': 'All', wet_food: 'Wet food', dry_food: 'Dry food', packaging: 'Packaging', consumable: 'Consumable', resale: 'Resale' };
/* One status per ingredient, combining "can it be deducted at all" with the
   runway the Forecasts page computes — so the tab you click here means the
   same thing it means there.

   no_data is deliberately NOT healthy: it means ingredient_depletion() found
   zero days of recorded consumption for this item, i.e. nothing has ever
   measured whether it's running low. A lack of evidence is not evidence of
   health — collapsing it into 'healthy' silently told a manager 86% of a
   fresh install's stock was fine when none of it had been measured at all.
   The two defensive fallbacks below (an unmapped risk string, or no
   depletion row at all) carry the same reasoning: absence of a signal is
   never treated as a good signal. */
const INV_STATUS = { out: 'out', critical: 'critical', warning: 'low', ok: 'healthy', idle: 'healthy', no_data: 'insufficient_data' };
function invStatus(i) {
  if (!i.is_deductable) return 'unset';
  const d = STATE.inventory.dep[i.id];
  return d ? (INV_STATUS[d.risk] || 'insufficient_data') : 'insufficient_data';
}
const INV_TABS = [
  ['', 'All'], ['out', 'Out'], ['critical', 'Critical'], ['low', 'Low'],
  ['healthy', 'Healthy'], ['insufficient_data', 'Not measured'],
  ['unset', 'No pack size'], ['sub', 'Sub-recipes'],
];
const INV_CHIP = {
  out: ['bad', 'Out of stock'], critical: ['bad', 'Critical'], low: ['warn', 'Running low'],
  healthy: ['ok', 'Healthy'], insufficient_data: ['mute', 'Not measured'],
  unset: ['amber', 'No pack size'],
};
// food_ingredient is the common case and gets no badge — only the two
// exceptions are worth calling out in the table.
const TYPE_CHIP = {
  sellable_product: ['info', 'Sellable product'],
  operational_supply: ['fore', 'Operational supply'],
};
function inventoryFilteredList() {
  const st = STATE.inventory;
  let list = st.data;
  if (st.status === 'sub') list = list.filter(i => i.kind === 'sub_recipe');
  else if (st.status) list = list.filter(i => invStatus(i) === st.status);
  if (st.cat) list = list.filter(i => i.category === st.cat);
  if (st.q) list = list.filter(i => i.name.toLowerCase().includes(st.q.toLowerCase()));
  if (st.onlyBlocked) list = list.filter(i => !i.is_deductable);
  return list;
}
function renderInventory() {
  const st = STATE.inventory;
  const list = inventoryFilteredList();
  const val = inventoryValuation();
  const count = s => st.data.filter(i => s === 'sub' ? i.kind === 'sub_recipe' : invStatus(i) === s).length;
  const unverified = st.data.reduce((a, i) => a + (i.unverified_count || 0), 0);
  setWork(`
    <div class="grid g4">
      ${kpi('Inventory value', money0(val.total), `${val.priced} of ${val.total_count} priced`, 'cash')}
      ${kpi('Out of stock', count('out'), 'blocking menu items', 'warn')}
      ${kpi('Critical', count('critical'), 'inside delivery time', 'clock')}
      ${kpi('Numbers unverified', unverified, 'still placeholders', 'db', 'verification')}
    </div>
    <div class="card">
      <div class="card-h">
        <div><h2>Ingredients</h2><p>${st.data.length} tracked · click any row for its full detail, conversions and history</p></div>
        <div class="r">
          <label class="search">${ic('srch')}<input class="field-sm" data-bind="inv-q" placeholder="Search ingredients…" value="${esc(st.q)}" style="width:200px"></label>
          <select class="field-sm" data-act="inv-cat-sel">${Object.keys(CAT_LABELS).map(c =>
            `<option value="${c}" ${st.cat === c ? 'selected' : ''}>${esc(c ? CAT_LABELS[c] : 'All categories')}</option>`).join('')}</select>
          <button class="btn btn-s btn-sm" data-act="inv-bulk">${ic('scale')}Bulk update</button>
          <button class="btn btn-p btn-sm" data-act="inv-add">${ic('inv')}Add ingredient</button>
        </div>
      </div>
      <div class="card-b tight"><div class="tabs">${INV_TABS.map(([k, l]) =>
        `<button class="tab ${st.status === k ? 'on' : ''}" data-act="inv-status" data-s="${k}">${esc(l)}${k ? ` <span class="sub">${count(k)}</span>` : ''}</button>`).join('')}</div></div>
      <div class="tw"><table>
        <thead><tr><th>Ingredient</th><th>Category</th><th class="n">Available</th><th class="n">Reserved</th>
          <th>Base</th><th class="n">Pack</th><th class="n">Days supply</th><th>Status</th><th></th></tr></thead>
        <tbody>${list.length ? list.map(i => {
          const d = st.dep[i.id], s = invStatus(i), chip = INV_CHIP[s] || INV_CHIP.healthy;
          const tchip = TYPE_CHIP[i.inventory_type];
          return `<tr class="row-link" data-act="ing-open" data-id="${i.id}">
            <td><div class="nm">${esc(i.name)}${tchip ? ` <span class="chip ${tchip[0]} no-dot">${esc(tchip[1])}</span>` : ''}${i.unverified_count ? ` <span class="chip warn no-dot" title="${i.unverified_count} number(s) still unverified">?</span>` : ''}${i.kind === 'sub_recipe' ? ` <span class="chip fore no-dot">sub</span>` : ''}</div>
              <div class="sub">${esc(i.ingredient_id)}</div></td>

            <td class="n">${esc(i.on_hand_display)}</td>

/* Builds the shared "actual then forecast" line chart from one item's
   /console/forecasts/demand payload. Used by the Forecasts page, the
   dashboard card and the per-item modal so all three read identically. */
function forecastChart(d, h, histDays) {
  const keep = histDays || 21;
  const offset = Math.max(0, d.series.length - keep);          // series index → chart x
  const hist = d.series.slice(-keep).map((p, i) => ({ x: i, y: p.qty }));
  const lastX = hist.length - 1;
  const hasRange = d.forecast.length && d.forecast[0].low !== undefined;
  const fc = d.forecast.map((p, i) => ({ x: lastX + 1 + i, y: p.qty }));

  // The model's own fit over the days it trained on. Seeing it against what
  // really happened is what makes the forecast readable — you can judge
  // whether it tracks this item before trusting where it points next.
  const fitted = (d.fitted || []).slice(-keep).map((p, i) => ({ x: i, y: p.qty }));
  // Days the model got badly wrong, scored server-side against its own fit.
  const marks = (d.outliers || [])
    .filter(o => o.index >= offset)
    .map(o => ({ x: o.index - offset, y: o.qty,
                 t: `${o.date}: sold ${o.qty}, model expected ${o.expected} (${o.sigma}σ off)` }));

  const series = [{ name: 'Actual', color: CV('--text'), data: hist, fill: 1, w: 2, dot: false }];
  if (fitted.length) series.push({ name: 'Fitted', color: CV('--info-fill'), data: fitted, w: 1.5, dot: false });
  series.push({ name: 'Forecast', color: CV('--fore-fill'), dash: 1, w: 2, data: [{ x: lastX, y: hist[lastX].y }].concat(fc) });

  return {
    hasRange, outlierCount: marks.length,
    svg: lineChart({
      h: h || 240, yfmt: v => v.toFixed(0), split: lastX, series, marks,
      band: hasRange ? d.forecast.map((p, i) => ({ x: lastX + 1 + i, lo: p.low, hi: p.high })) : null,
    }),
    legend: `<div class="legend">
      <span class="it"><i class="sw" style="background:${CV('--text')}"></i>Actually sold</span>
      ${fitted.length ? `<span class="it"><i class="sw" style="background:${CV('--info-fill')}"></i>Model's fit</span>` : ''}
      <span class="it"><i class="sw" style="background:${CV('--fore-fill')}"></i>Forecast</span>
      ${hasRange ? `<span class="it"><i class="sw sq" style="background:${CV('--fore-fill')};opacity:.3"></i>Likely range</span>` : ''}
      ${marks.length ? `<span class="it"><i class="sw sq" style="background:${CV('--bad-fill')};border-radius:99px"></i>Unusual day</span>` : ''}
    </div>`,
  };
}

async function loadForecastChart() {
  const ready = STATE.forecasts.dem.filter(d => !d.insufficient_data);
  if (!ready.length) return;
  const best = ready.reduce((a, b) => (b.active_days > a.active_days ? b : a));
  try {
    const d = await api('/console/forecasts/demand?menu_item_pk=' + best.menu_item_id + '&horizon_days=14');
    const card = $('#foreChartCard');
    if (!card) return;                       // navigated away while loading
    if (d.insufficient_data || !d.forecast.length) { card.style.display = 'none'; return; }
    const c = forecastChart(d, 240, 45);
    const total = d.forecast.reduce((s, f) => s + f.qty, 0);
    card.innerHTML = `
      <div class="card-h"><div><h2>${esc(d.name)} — demand forecast</h2>
        <p>${d.method === 'prophet' ? 'Prophet' : 'Quick estimate'} · next 14 days${c.hasRange ? ' · shaded band is the likely range' : ''}${d.seasonality_applied ? ' · adjusted for day of the week' : ''}</p></div>
        <div class="r"><button class="btn btn-s btn-sm" data-act="demand-chart" data-id="${d.menu_item_id}">${ic('fore')}Open larger</button></div></div>
      <div class="card-b tight">
        <div style="display:flex;gap:var(--s3);flex-wrap:wrap;margin-bottom:6px">
          <div><div class="sub">Predicted, next 14 days</div><div class="num" style="font-size:22px;font-weight:600">${num(total, 0)} units</div></div>
          <div><div class="sub">Recent daily average</div><div class="num" style="font-size:22px;font-weight:600">${num(d.trailing_avg_daily, 1)}</div></div>
          <div><div class="sub">Days with a sale</div><div class="num" style="font-size:22px;font-weight:600">${d.active_days}</div></div>
        </div>
        ${c.svg}${c.legend}
      </div>`;
  } catch (e) { const card = $('#foreChartCard'); if (card) card.style.display = 'none'; }
}

function renderAnomaly() {
  const list = STATE.anomaly.losses;
  const high = list.filter(a => a.severity === 'high');
  const byIng = {};
  list.forEach(a => { byIng[a.ingredient_name] = (byIng[a.ingredient_name] || 0) + 1; });
  const top = Object.entries(byIng).sort((a, b) => b[1] - a[1]).slice(0, 8)
    .map(([n, v]) => ({ l: n.slice(0, 11), v, t: v + ' flagged' }));
  const cons = STATE.anomaly.consumption;
  const consHigh = cons.filter(a => a.severity === 'high');
  setWork(`
    ${note('Two checks, on two different kinds of evidence. The first reads reconciled unlimited service days — how much the kitchen actually weighed out against how much the head count predicted — and flags a day whose pattern stands apart from the rest. The second double-checks every waste, spoilage and stock-count entry from the last 90 days for a loss far bigger than usual for that ingredient. Both use a machine-learning model called Isolation Forest, each with a simple backup rule so a first-ever oddity is still caught before there is enough history to compare against. Both only ever describe — nothing is adjusted or acted on automatically.')}
    <div class="grid g4">
      ${kpi('Service days flagged', cons.length, 'reconciled unlimited days', 'scale')}
      ${kpi('Of those, urgent', consHigh.length, 'far off the estimate', 'warn')}
      ${kpi('Stock losses flagged', list.length, 'last 90 days', 'anom')}
      ${kpi('Ingredients involved', Object.keys(byIng).length, '', 'pkg')}
    </div>

      <div class="card-b tight">${bars(top, 180, CV('--warn-fill'), v => v.toFixed(0))}</div></div>` : ''}
    <div class="card">
      <div class="card-h"><div><h2>Flagged stock losses</h2><p>Waste, spoilage and count corrections · most recent first</p></div></div>
      <div class="tw"><table><thead><tr><th>When</th><th>Ingredient</th><th>What happened</th><th class="n">Amount</th><th>Flagged because</th><th>Details</th><th>Priority</th></tr></thead>
      <tbody>${list.length ? list.map(a => `<tr>
        <td class="sub">${esc(a.created_at)}</td>
        <td class="nm">${esc(a.ingredient_name)}</td>
        <td>${reasonChip(a.reason)}</td>
        <td class="n" style="color:var(--bad-text)">${num(a.delta_base, 2)} ${esc(a.base_unit)}</td>
        <td class="sub">${esc(ANOMALY_METHOD_LABELS[a.method] || a.method)}</td>
        <td class="sub wrap">${esc(a.why)}</td>
        <td><span class="chip ${a.severity === 'high' ? 'bad' : 'warn'}">${a.severity === 'high' ? 'Review soon' : 'Worth a look'}</span></td>
      </tr>`).join('') : `<tr><td colspan="7">${emptyState('Nothing flagged', 'No waste, spoilage or stock-count entry in the last 90 days looked out of the ordinary — including if there simply are not any yet.')}</td></tr>`}</tbody></table></div>
    </div>`);
}

/* ===================== UNLIMITED RECONCILIATION =====================
   The three-stage model, made operable rather than merely displayed:

     Stage 1  the provisional quantity the POS already deducted (read-only —
              it happened at order time and cannot be edited here)
     Stage 2  the two weights the kitchen takes, entered in the stream's own
              base unit
     Stage 3  expected vs measured, variance, tolerance verdict, and whether
              stock was corrected — all computed by the server and shown back,
              never calculated in this file. The live preview below is a
              convenience for the person holding the scale; the number that
              is recorded is the one the server returns. */
function unliDate() { return STATE.unli.date || new Date().toISOString().slice(0, 10); }

function varianceChip(status) {
  const map = { within_tolerance: 'ok', over_tolerance: 'bad', under_tolerance: 'warn' };
  const label = { within_tolerance: 'Within tolerance', over_tolerance: 'Used more than expected',
                  under_tolerance: 'Used less than expected' };
  return `<span class="chip ${map[status] || 'mute'}">${esc(label[status] || status || '—')}</span>`;
}
function validationChip(state) {
  const map = { validated: 'ok', pending_review: 'warn', rejected: 'mute' };
  const label = { validated: 'Signed off', pending_review: 'Awaiting sign-off', rejected: 'Excluded' };
  return `<span class="chip ${map[state] || 'mute'}">${esc(label[state] || state)}</span>`;
}

async function loadUnli() {
  const d = unliDate();
  const [pending, hist, coeff, tol, flav] = await Promise.all([
    api('/unli/reconciliation/pending?service_date=' + d),
    api('/unli/reconciliation?limit=120'),
    api('/unli/coefficients'),
    api('/unli/tolerance'),
    api('/unli/flavors?all_flavors=true'),
  ]);
  STATE.unli = { date: d, pending, history: hist.reconciliations, coefficients: coeff.streams,
                 tolerance: tol.tolerance_ratio, minHeads: tol.min_heads_for_recalibration,
                 flavors: flav.flavors };
  renderUnli();
}

/* Flavour pricing lives here rather than in the POS's JavaScript: the till
   must never decide what a special flavour costs. It reads the price back
   from this configuration, the same way it reads a menu price. */

    </div>

      <th>Price source</th><th>Offered</th><th></th></tr></thead>
    <tbody>${list.length ? list.map(f => `<tr>
      <td class="nm">${esc(f.display_name)}</td>
      <td>${f.flavor_type === 'special'
        ? '<span class="chip warn">Special</span>' : '<span class="chip ok">Included</span>'}</td>
      <td class="n">${f.flavor_type === 'special' ? money(f.addon_price) : '<span class="sub">—</span>'}</td>
      <td class="sub">${f.addon_menu_item_name

      <td class="n"><button class="btn btn-s btn-sm" data-act="unli-flavor" data-id="${f.id}">Edit</button></td>
    </tr>`).join('') : `<tr><td colspan="6">${emptyState('No flavors registered',
      'Every house sauce that is not a kitchen prep becomes a selectable flavor automatically.', 'spark')}</td></tr>`}
    </tbody></table></div>
    <div class="card-b"><p class="sub">Every flavor starts included at ₱0 — no premium pricing
      existed in this database, and inventing one would put a number nobody agreed to in front of
      a customer. Linking a flavor to a menu item takes the price from there instead, so a flavor
      also sold à la carte is priced in exactly one place.</p></div>
  </div>`;
}

function openFlavorModal(pk) {
  const f = (STATE.unli.flavors || []).find(x => x.id === pk);
  if (!f) return;
  openModal(`
    <h3>${esc(f.display_name)}</h3>
    <p class="sub">A special flavor adds its price to the bill as a separate, linked charge each
      time it is served. The original paid order is never changed.</p>
    <label for="flType">Type</label>
    <select class="field" id="flType">
      <option value="included" ${f.flavor_type === 'included' ? 'selected' : ''}>Included in the unlimited price</option>
      <option value="special" ${f.flavor_type === 'special' ? 'selected' : ''}>Special — adds to the bill</option>
    </select>
    <div id="flPriceWrap" style="display:${f.flavor_type === 'special' ? '' : 'none'}">
      <label for="flPrice">Add-on price (₱)</label>
      <input class="field" id="flPrice" type="number" min="0" step="1"
             value="${f.flavor_type === 'special' ? f.addon_price : ''}">
    </div>
    <label for="flActive">Offered on the POS</label>
    <select class="field" id="flActive">
      <option value="1" ${f.is_active ? 'selected' : ''}>Yes</option>
      <option value="0" ${!f.is_active ? 'selected' : ''}>Withdrawn</option>
    </select>
    <div id="modalErr" style="display:none"></div>
    <div class="actions"><button class="btn btn-s" data-act="modal-cancel">Cancel</button>
      <button class="btn btn-p" id="flSave">Save</button></div>`);
  $('#flType').addEventListener('change', e => {
    $('#flPriceWrap').style.display = e.target.value === 'special' ? '' : 'none';
  });
  $('#flSave').addEventListener('click', async () => {
    const type = $('#flType').value;
    const body = { flavor_type: type, is_active: $('#flActive').value === '1' };

      const v = parseFloat($('#flPrice').value);

    try {
      await api(`/unli/flavors/${pk}`, { method: 'PATCH', body: JSON.stringify(body) });
      closeModal(); toast('Saved.'); await loadUnli();

function renderUnli() {
  const st = STATE.unli, p = st.pending;
  const done = p.streams.filter(s => s.reconciled);
  const open = p.streams.filter(s => !s.reconciled && s.heads > 0);
  const idle = p.streams.filter(s => !s.reconciled && s.heads === 0);
  const awaiting = st.history.filter(h => h.validation_state === 'pending_review');

  setWork(`
    ${note(`How much an unlimited order eats cannot be known when it is punched, so the till deducts an estimate — head count times the current portion coefficient. This page closes that loop: the kitchen weighs what went out and what came back, the difference is what was really eaten, and only the gap between the two is posted to stock. Days that land within ${(st.tolerance * 100).toFixed(0)}% of the estimate are signed off automatically; anything further out waits for a manager before it is allowed to move the coefficient.`)}

    <div class="grid g4">
      ${kpi('Service date', st.date, 'covers counted from completed orders', 'exp')}
      ${kpi('Streams reconciled', `${done.length} / ${p.streams.length}`, 'for this date', 'scale')}
      ${kpi('Still to weigh', open.length, open.length ? 'has covers, no measurement yet' : 'nothing outstanding', 'clock')}
      ${kpi('Awaiting sign-off', awaiting.length, 'outside tolerance', 'warn')}
    </div>

    <div class="card">
      <div class="card-h"><div><h2>Reconcile a service date</h2>
        <p>Pick the date, then enter what was weighed for each stream</p></div>
        <div class="r">
          <input class="field" id="unliDate" type="date" value="${esc(st.date)}" style="max-width:180px">
          <button class="btn btn-s btn-sm" data-act="unli-date">Load</button>
        </div></div>
      <div class="tw"><table><thead><tr>
        <th>Stream</th><th>Deducts from</th><th class="n">Covers</th>
        <th class="n">Coefficient</th><th class="n">Expected (provisional)</th>
        <th class="n">Measured</th><th class="n">Variance</th><th>Tolerance</th>
        <th>Stock corrected</th><th></th></tr></thead>
      <tbody>${p.streams.length ? p.streams.map(s => {
        const r = s.reconciled;
        return `<tr>
          <td class="nm">${esc(s.label)}</td>
          <td class="sub">${esc(s.ingredient_name)}</td>
          <td class="n">${s.heads}</td>
          <td class="n sub">${s.lambda_used != null ? num(s.lambda_used, 1) + ' ' + esc(s.base_unit) + '/head' : '—'}</td>
          <td class="n">${s.heads ? num(s.theoretical_base, 0) + ' ' + esc(s.base_unit) : '<span class="sub">—</span>'}</td>
          <td class="n">${r ? num(r.actual_base, 0) + ' ' + esc(s.base_unit) : '<span class="sub">not weighed</span>'}</td>
          <td class="n">${r ? `<span style="color:${r.variance_base > 0 ? 'var(--bad-text)' : 'var(--ok-text)'}">
              ${r.variance_base > 0 ? '+' : ''}${num(r.variance_base, 0)} ${esc(s.base_unit)}
              (${r.variance_ratio != null ? (r.variance_ratio > 0 ? '+' : '') + num(r.variance_ratio * 100, 1) + '%' : '—'})</span>`
            : '<span class="sub">—</span>'}</td>
          <td>${r ? varianceChip(r.status) : '<span class="sub">—</span>'}</td>
          <td>${r ? (Math.abs(r.correction_base) > 0.001
              ? `<span class="chip info">${r.correction_base > 0 ? '+' : ''}${num(r.correction_base, 0)} ${esc(s.base_unit)}</span>`
              : '<span class="chip ok">no change needed</span>')
            : '<span class="sub">—</span>'}</td>
          <td class="n">${r
            ? validationChip(r.validation_state)
            : s.heads > 0
              ? `<button class="btn btn-p btn-sm" data-act="unli-measure" data-key="${esc(s.item_key)}">${ic('scale')}Enter weights</button>`
              : '<span class="sub">no covers</span>'}</td>
        </tr>`;
      }).join('') : `<tr><td colspan="10">${emptyState('No unlimited streams configured', '', 'scale')}</td></tr>`}
      </tbody></table></div>
      ${idle.length && !done.length ? `<div class="card-b"><p class="sub">

        no provisional deduction to reconcile against. Pick a date with unlimited orders on it.</p></div>` : ''}
    </div>

    ${(() => {
      const rc = p.refill_context || {};
      if (!rc.refills_served && !rc.refills_voided) return '';
      return `<div class="card">
        <div class="card-h"><div><h2>What the floor recorded serving</h2>
          <p>Operational context for ${esc(st.date)} — refill records, not an input to the variance above</p></div></div>
        <div class="grid g4" style="padding:var(--s4) var(--s4) 0">
          ${kpi('Refills served', rc.refills_served || 0, `${rc.sessions || 0} table${rc.sessions === 1 ? '' : 's'}`, 'rec')}

          ${kpi('Sauce consumed', num(rc.sauce_base || 0, 0) + ' g', 'deducted per flavor recipe', 'spark')}

        </div>
        ${(rc.by_flavor || []).length ? `<div class="card-b tight">
          ${bars((rc.by_flavor || []).slice(0, 8).map(f => ({ l: f.flavor_name.replace(/ Sauce$/, '').slice(0, 11),
            v: f.pieces, t: f.pieces + ' pcs · ' + f.refills + ' refill' + (f.refills === 1 ? '' : 's') })),
            170, CV('--fore-fill'), v => v.toFixed(0))}</div>` : ''}
        <div class="card-b"><p class="sub">Refills record wings by the piece; the provisional
          deduction above sizes wings by the gram from λ. They are shown side by side rather than
          combined — the expected figure has to keep reproducing exactly what the ledger did at
          checkout, so a second estimate is never folded into it.</p></div>
      </div>`;
    })()}

    ${awaiting.length ? `<div class="card">
      <div class="card-h"><div><h2>Waiting for sign-off</h2>
        <p>These landed outside tolerance — stock was already corrected, but they will not move a coefficient until someone agrees they are a real portion measurement</p></div></div>
      <div class="tw"><table><thead><tr><th>Service date</th><th>Stream</th><th class="n">Covers</th>
        <th class="n">Expected</th><th class="n">Measured</th><th class="n">Variance</th><th>Note</th><th></th></tr></thead>
      <tbody>${awaiting.map(h => `<tr>
        <td class="sub">${esc(h.service_date)}</td>
        <td class="nm">${esc(h.label)}</td>
        <td class="n">${h.heads}</td>
        <td class="n sub">${num(h.theoretical_base, 0)} ${esc(h.base_unit)}</td>
        <td class="n">${num(h.actual_base, 0)} ${esc(h.base_unit)}</td>
        <td class="n" style="color:var(--warn-text)">${h.variance_pct > 0 ? '+' : ''}${num(h.variance_pct, 1)}%</td>
        <td class="sub wrap">${esc(h.note || '')}</td>
        <td class="n" style="white-space:nowrap">

        </td></tr>`).join('')}</tbody></table></div>
    </div>` : ''}

    ${flavorCard()}

    <div class="card">
      <div class="card-h"><div><h2>Portion coefficients</h2>
        <p>The frozen baseline is what variance is measured against; the rolling value is what the till deducts</p></div>
        <div class="r">
          <button class="btn btn-s btn-sm" data-act="unli-recal" data-dry="1">Preview recalibration</button>
          <button class="btn btn-p btn-sm" data-act="unli-recal" data-dry="0">${ic('refresh')}Recalibrate from validated days</button>
        </div></div>
      <div class="tw"><table><thead><tr><th>Stream</th><th>Deducts from</th>
        <th class="n">Baseline λ</th><th class="n">Current rolling λ</th><th class="n">Drift</th>
        <th class="n">Window</th><th class="n">Revisions</th></tr></thead>
      <tbody>${st.coefficients.map(c => {
        const drift = (c.baseline_lambda && c.rolling_lambda)
          ? (c.rolling_lambda - c.baseline_lambda) / c.baseline_lambda * 100 : null;
        return `<tr>
          <td class="nm">${esc(c.label)}</td>
          <td class="sub">${esc(c.ingredient_name)}</td>
          <td class="n sub">${c.baseline_lambda != null ? num(c.baseline_lambda, 1) + ' ' + esc(c.base_unit) : '—'}</td>
          <td class="n">${c.rolling_lambda != null ? num(c.rolling_lambda, 1) + ' ' + esc(c.base_unit) : '—'}</td>
          <td class="n">${drift == null ? '<span class="sub">—</span>'
            : `<span style="color:${Math.abs(drift) > 10 ? 'var(--warn-text)' : 'inherit'}">${drift > 0 ? '+' : ''}${num(drift, 1)}%</span>`}</td>
          <td class="n sub">${c.window_days}d</td>
          <td class="n sub">${c.rolling_revisions}</td>
        </tr>`; }).join('')}</tbody></table></div>
      <div class="card-b"><p class="sub">Recalibration pools every signed-off day of at least
        ${esc(String(st.minHeads))} covers inside each stream's window: λ = total measured ÷ total covers.
        It writes a new coefficient rather than overwriting the old one, so what the till deducted on any
        past date stays recoverable.</p></div>
    </div>

    <div class="card">
      <div class="card-h"><div><h2>Reconciliation history</h2>
        <p>Every measurement, verdict and correction · most recent first</p></div>
        <div class="r">
          <button class="btn btn-s btn-sm" data-act="unli-tolerance">Tolerance: ${(st.tolerance * 100).toFixed(0)}%</button>

        </div></div>
      <div class="tw"><table><thead><tr><th>Service date</th><th>Stream</th><th class="n">Covers</th>
        <th class="n">Out</th><th class="n">Added</th><th class="n">Left over</th>
        <th class="n">Measured</th><th class="n">Expected</th><th class="n">Variance</th>
        <th class="n">Per head</th><th>Tolerance</th><th class="n">Correction</th><th>Status</th></tr></thead>
      <tbody>${st.history.length ? st.history.map(h => `<tr>

        'Once a service date with unlimited orders has been weighed and submitted, it appears here and becomes part of what the coefficient and the anomaly model learn from.', 'scale')}</td></tr>`}
      </tbody></table></div>
    </div>`);
}

/* Stage 2 entry. Two weights in, everything else computed — the preview
   mirrors the server's arithmetic so the person at the scale sees the verdict
   before committing, but the recorded figures are the server's response. */
function openUnliMeasureModal(itemKey) {
  const st = STATE.unli;
  const s = st.pending.streams.find(x => x.item_key === itemKey);
  if (!s) return;
  openModal(`
    <h3>${esc(s.label)} — ${esc(st.date)}</h3>
    <p class="sub">${s.heads} cover${s.heads === 1 ? '' : 's'} served.
      The till already deducted <b>${num(s.theoretical_base, 0)} ${esc(s.base_unit)}</b> of
      ${esc(s.ingredient_name)} for them, at ${num(s.lambda_used, 1)} ${esc(s.base_unit)} a head.</p>
    <div class="note"><div><b>What to weigh</b><p>All three figures in ${esc(s.base_unit)}.
      If the container is on the scale for one reading, keep it on for the other — the tare
      cancels between them.</p></div></div>
    <label for="uOpen">Weighed out at start of service</label>
    <input class="field" id="uOpen" type="number" min="0" step="1" inputmode="decimal" placeholder="0">
    <label for="uAdd">Topped up during service (0 if none)</label>
    <input class="field" id="uAdd" type="number" min="0" step="1" inputmode="decimal" value="0">
    <label for="uClose">Left over at close</label>
    <input class="field" id="uClose" type="number" min="0" step="1" inputmode="decimal" placeholder="0">
    <label for="uNote">Note (optional)</label>
    <input class="field" id="uNote" placeholder="anything unusual about the service">
    <div id="uPreview" style="margin-top:var(--s3)"></div>
    <div id="modalErr" style="display:none"></div>
    <div class="actions"><button class="btn btn-s" data-act="modal-cancel">Cancel</button><button class="btn btn-p" id="uSubmit" disabled>Submit reconciliation</button></div>`);

  const f = id => parseFloat($(id).value);
  function preview() {
    const o = f('#uOpen'), a = f('#uAdd') || 0, c = f('#uClose');
    const ok = !isNaN(o) && !isNaN(c) && c <= o + a;
    $('#uSubmit').disabled = !ok;
    if (isNaN(o) && isNaN(c)) { $('#uPreview').innerHTML = ''; return; }
    if (!ok) {
      $('#uPreview').innerHTML = `<div class="note bad"><div><b>Check the readings</b>
        <p>Leftover cannot be more than what went out.</p></div></div>`;
      return;
    }
    const actual = o + a - c;
    const variance = actual - s.theoretical_base;
    const ratio = s.theoretical_base > 0 ? variance / s.theoretical_base : 0;
    const within = Math.abs(ratio) <= st.tolerance;
    $('#uPreview').innerHTML = `<div class="note ${within ? '' : 'warn'}"><div>
      <b>${num(actual, 0)} ${esc(s.base_unit)} actually used
        · ${num(actual / s.heads, 1)} ${esc(s.base_unit)} a head</b>
      <p>Expected ${num(s.theoretical_base, 0)} ${esc(s.base_unit)} ·
        variance ${variance > 0 ? '+' : ''}${num(variance, 0)} ${esc(s.base_unit)}
        (${ratio > 0 ? '+' : ''}${num(ratio * 100, 1)}%) ·
        ${within ? `inside the ${(st.tolerance * 100).toFixed(0)}% tolerance — signs off automatically`
                 : `outside the ${(st.tolerance * 100).toFixed(0)}% tolerance — a manager will be asked to confirm it`}.
        Stock will be ${Math.abs(variance) < 0.5 ? 'left as it is' :
          variance > 0 ? `reduced by a further ${num(Math.abs(variance), 0)} ${esc(s.base_unit)}`
                       : `credited back ${num(Math.abs(variance), 0)} ${esc(s.base_unit)}`}.</p>
    </div></div>`;
  }
  ['#uOpen', '#uAdd', '#uClose'].forEach(id => $(id).addEventListener('input', preview));
  $('#uOpen').focus();

  $('#uSubmit').addEventListener('click', async () => {
    const btn = $('#uSubmit'); btn.disabled = true;
    try {
      const r = await api('/unli/reconciliation', {
        method: 'POST',
        body: JSON.stringify({
          service_date: st.date, item_key: itemKey,
          opening_base: f('#uOpen'), added_base: f('#uAdd') || 0,
          closing_base: f('#uClose'), note: $('#uNote').value.trim() || null,
        }),
      });
      closeModal();
      toast(r.inventory_corrected
        ? `${r.label} reconciled — stock ${r.correction_base < 0 ? 'reduced by' : 'credited'} ${Math.abs(r.correction_base).toFixed(0)} ${r.base_unit}.`
        : `${r.label} reconciled — measurement matched the estimate, no correction needed.`);
      await loadUnli();
    } catch (e) { modalError(e.message); btn.disabled = false; }
  });
}
